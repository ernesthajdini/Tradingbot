# ============================================================================
# RESUMED 2026-09-01 (owner decision), after the zero-bid entry bug was fixed
# in main.py — entries now require a real two-sided quote, so the paper record
# stops accumulating contracts nobody was bidding on.
#
# Standing context: the backtest programme found no edge across 360 declared
# configurations (csp_screener/backtest/MANIFEST.md). These runs therefore
# feed the PAPER record and the dashboard, not a live-trading decision. The
# 200-trade go-live gate remains forward-operational and is not satisfied by
# any simulated history.
# ============================================================================
name: CSP Screener — Sunday weekly run

on:
  schedule:
  # 22:00 UTC on Sunday = 18:00 ET (when DST is on; 17:00 EST otherwise).
  # Run an hour early to ensure the weekly email arrives before users wake up Monday.
  - cron: '0 22 * * 0'
  workflow_dispatch:  # also runnable manually

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_TO: ${{ secrets.RESEND_TO }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests supabase

      - name: Run weekly screener
        run: python -m csp_screener.main --no-ibkr

      - name: Verify data landed in Supabase
        run: |
          python -c "
          import sys
          from csp_screener import supabase_sync
          if not supabase_sync.is_enabled():
              print('WARNING: Supabase not configured — running local-only.')
              print('Set SUPABASE_URL and SUPABASE_SERVICE_KEY repo secrets.')
              sys.exit(1)
          if not supabase_sync.verify_recent_screen():
              print('FAIL: screener ran but NOTHING landed in Supabase.')
              print('Check SUPABASE_URL (no /rest/v1 suffix!) and SUPABASE_SERVICE_KEY.')
              sys.exit(1)
          print('OK: Supabase has a fresh screens row.')
          "

      - name: Upload journal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-sunday-${{ github.run_number }}
          path: |
            csp_screener/output/journal/
            csp_screener/output/logs/
            csp_screener/output/email_preview_*.html
          retention-days: 30
