name: CSP Screener — daily virtual position update

on:
  schedule:
    # Hourly during US market hours, Mon-Fri:
    # 14:35–20:35 UTC ≈ 10:35 ET through 16:35 ET (covers open to close).
    # Public repo = free unlimited Actions minutes, so hourly costs nothing.
    - cron: '35 14-20 * * 1-5'
    # Final end-of-day pass after close
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  daily-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_TO: ${{ secrets.RESEND_TO }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL_DAILY }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests supabase

      - name: Run daily check
        run: python -m csp_screener.daily_check
